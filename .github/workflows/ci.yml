name: RetainAI release gate

on:
  pull_request:
  push:
    branches:
      - deploy
      - "fix/**"

concurrency:
  group: retainai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan of new commits and tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the official release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      - name: Prove the scanner catches synthetic secrets
        run: python3 .github/secret-scan/scan.py selftest
      - name: Scan commits added by this change
        run: python3 .github/secret-scan/scan.py commits
      - name: Scan files tracked at this commit
        run: python3 .github/secret-scan/scan.py tree

  backend:
    name: Backend security and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      FLASK_ENV: testing
      ENVIRONMENT: test
      RUN_SCHEDULER: "0"
      SESSION_SECRET: ci-session-secret-is-stable-and-long-enough
      DATA_ENCRYPTION_KEY: ci-data-key-is-independent-and-long-enough
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        run: python -m unittest discover -s backend -p 'test_*.py' -v

  frontend:
    name: Frontend tests, lint, build, and production audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Same version Render builds with (NODE_VERSION) and frontend/.node-version.
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
      - name: Run frontend lint
        run: npx eslint src --ext .js,.jsx --no-cache --max-warnings=0
      - name: Build production bundle
        run: npm run build
        env:
          CI: "true"
          DISABLE_ESLINT_PLUGIN: "true"
      - name: Reject moderate or higher production dependency findings
        run: npm audit --omit=dev --audit-level=moderate
      - name: Reject critical findings in development tools
        run: npm audit --audit-level=critical
